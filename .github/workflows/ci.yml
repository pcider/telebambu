name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      # tests/ has no __init__.py, so `unittest discover` finds nothing.
      # Build the module list from the glob and run it in one unittest call.
      - name: Unit tests
        shell: bash
        run: |
          set -euo pipefail
          modules=()
          for f in tests/test_*.py; do
            [ -e "$f" ] || continue
            m=${f%.py}
            modules+=("${m//\//.}")
          done
          if [ ${#modules[@]} -eq 0 ]; then
            echo "No tests/test_*.py modules found" >&2
            exit 1
          fi
          echo "Running: ${modules[*]}"
          python -m unittest -v "${modules[@]}"

      - name: Byte-compile
        run: python -m compileall -q .
